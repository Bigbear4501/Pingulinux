# Pingulinux: Anmeldebildschirm SDDM (KDE)
[General]
# Bildschirmtastatur im Anmeldebildschirm (Knopf unten links,
# auf Tablets zum Antippen)
InputMethod=qtvirtualkeyboard
Numlock=on

[Theme]
Current=breeze
EnableAvatars=true
CursorTheme=breeze_cursors

[Users]
# Nur echte Konten anzeigen (Eltern und Kinder)
MinimumUid=1000
MaximumUid=59999
RememberLastUser=true
RememberLastSession=true
