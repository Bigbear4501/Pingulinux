# Pingulinux: Anmeldebildschirm SDDM (KDE)
[General]
# Anmeldebildschirm unter Wayland mit KWin: Die Bildschirmtastatur (Maliit)
# geht auf Touch-Geräten beim Antippen des Passwortfelds von selbst auf,
# mit Maus und Tastatur bleibt sie zu (getestet: Surface und VM, h16/b12).
# Falls ein Gerät nur einen schwarzen Bildschirm zeigt: Strg+Alt+F2,
# anmelden, in dieser Datei die Zeilen DisplayServer, GreeterEnvironment und
# den Abschnitt [Wayland] löschen, InputMethod=qtvirtualkeyboard eintragen
# (alter Weg: Tastatur per Knopf unten links), neu starten.
DisplayServer=wayland
InputMethod=
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell
Numlock=on

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1 --inputmethod maliit-keyboard

[Theme]
Current=breeze
EnableAvatars=true
CursorTheme=breeze_cursors

[Users]
# Nur echte Konten anzeigen (Eltern und Kinder)
MinimumUid=1000
MaximumUid=59999
RememberLastUser=true
RememberLastSession=true
