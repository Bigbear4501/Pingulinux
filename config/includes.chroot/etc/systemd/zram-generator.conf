# Pingulinux: zram – komprimierter Auslagerungsspeicher im Arbeitsspeicher.
# Hilft Rechnern mit wenig RAM (z. B. 4 GB), wenn KDE, Firefox und ein Spiel
# gleichzeitig laufen. Halber Arbeitsspeicher, höchstens 4 GB, Kompression zstd.
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
