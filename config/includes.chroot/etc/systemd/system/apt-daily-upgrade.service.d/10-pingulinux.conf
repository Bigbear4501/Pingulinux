# Pingulinux (bz22): nicht im Live-Modus, Sicherheitsquelle prüfen und vor dem
# Update die tägliche Sicherung anlegen, falls sie fällig ist – so lässt sich
# ein schlechtes Update mit „Gestern wiederherstellen“ rückgängig machen.
[Unit]
ConditionKernelCommandLine=!boot=live

[Service]
ExecStartPre=-/usr/local/bin/pingulinux-sicherheitsquelle.sh
ExecStartPre=-/usr/local/bin/pingulinux-timeshift-einrichten.sh
