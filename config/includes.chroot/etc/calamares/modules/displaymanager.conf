---
# Pingulinux OS: LightDM mit XFCE als Standard-Sitzung.
# Ohne diese Vorgabe waehlt Calamares nach der Installation selbst eine
# Sitzung aus der Liste der installierten Desktops (und nimmt KDE Plasma).
displaymanagers:
  - lightdm

defaultDesktopEnvironment:
  executable: "startxfce4"
  desktopFile: "xfce"

basicSetup: false
sysconfigSetup: false
