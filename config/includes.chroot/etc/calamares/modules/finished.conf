# finished.conf - Konfiguration für die "Fertig"-Seite
#
# restartNowEnabled: zeigt die Checkbox "Jetzt neu starten" an
# restartNowChecked: Checkbox ist beim Öffnen der Seite bereits angehakt,
#                     damit ein Klick auf "Fertig" direkt neu startet
restartNowEnabled: true
restartNowChecked: true
restartNowCommand: "systemctl reboot"
