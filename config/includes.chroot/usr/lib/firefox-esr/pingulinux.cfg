// Pingulinux: Sperre fuer Social-Media und normales YouTube pro Konto.
// Die erste Zeile dieser Datei muss ein Kommentar sein.
// Fuer Konten mit Markierungsdatei in /var/lib/pingulinux/blocksocial/
// wird eine feste Proxy-Konfigurationsdatei (PAC) gesetzt. Alle anderen
// Konten (Eltern) sind nicht betroffen.
try {
  var Cc = Components.classes, Ci = Components.interfaces;
  var env = Cc["@mozilla.org/process/environment;1"].getService(Ci.nsIEnvironment);
  var name = "";
  var home = env.exists("HOME") ? env.get("HOME") : "";
  if (home) { name = home.replace(/\/+$/, "").split("/").pop(); }
  if (!name || name === "root") { name = env.exists("USER") ? env.get("USER") : ""; }
  if (name && /^[a-z_][a-z0-9_-]*$/.test(name)) {
    var f = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
    f.initWithPath("/var/lib/pingulinux/blocksocial/" + name);
    if (f.exists()) {
      lockPref("network.proxy.type", 2);
      lockPref("network.proxy.autoconfig_url", "file:///usr/share/pingulinux/block-social.pac");
    }
  }
} catch (e) {}
